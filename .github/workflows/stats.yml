name: Metrics
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [stats-update]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Stats & Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/stats.svg
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_limit: 6
          config_timezone: Europe/Bratislava
          config_display: large

      - name: WakaTime
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/wakatime.svg
          base: ""
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_limit: 8
          plugin_wakatime_sections: time, languages
          config_timezone: Europe/Bratislava
