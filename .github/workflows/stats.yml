name: Metrics
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [stats-update]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/stats.svg
          base: header
          base_indepth: yes
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          config_timezone: Europe/Bratislava
          config_display: large
          config_background: "#0d1117"
          config_foreground: "#ffffff"
          config_animations: yes

      - name: Streak
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/streak.svg
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: no
          plugin_habits_charts: yes
          config_timezone: Europe/Bratislava
