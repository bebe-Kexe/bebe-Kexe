name: Update README cards
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [stats-update]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=kexe-dev&show_icons=true&hide_border=true&theme=dark&bg_color=0d1117&title_color=ffffff&icon_color=aaaaaa&text_color=bbbbbb&count_private=true&include_all_commits=true"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=kexe-dev&layout=compact&hide_border=true&theme=dark&bg_color=0d1117&title_color=ffffff&text_color=bbbbbb&langs_count=6"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update stats cards" || exit 0
          git push
